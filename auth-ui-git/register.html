<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta · JAS</title>

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <!-- Custom styles -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/index.css" />
  <link rel="stylesheet" href="css/register.css" />
</head>
<body>

  <div class="auth-card">

    <!-- Brand -->
    <div class="brand-icon">
      <i class="bi bi-person-plus-fill"></i>
    </div>
    <h2>Crea tu cuenta</h2>
    <p class="subtitle">Regístrate para empezar</p>

    <!-- Alert -->
    <div id="registerAlert" class="alert alert-auth mb-3" role="alert"></div>

    <!-- Form -->
    <form id="registerForm" novalidate onsubmit="handleRegister(event)">

      <!-- Nombre -->
      <div class="mb-3">
        <label for="registerName" class="form-label">
          <i class="bi bi-person me-1 text-muted"></i>Nombre completo
        </label>
        <input
          type="text"
          id="registerName"
          class="form-control"
          placeholder="Ingresa tu nombre"
          autocomplete="name"
          required
        />
      </div>

      <!-- Correo -->
      <div class="mb-3">
        <label for="registerEmail" class="form-label">
          <i class="bi bi-envelope me-1 text-muted"></i>Correo electrónico
        </label>
        <input
          type="email"
          id="registerEmail"
          class="form-control"
          placeholder="tu@email.com"
          autocomplete="email"
          required
        />
      </div>

      <!-- Contraseña -->
      <div class="mb-3">
        <label for="registerPassword" class="form-label">
          <i class="bi bi-lock me-1 text-muted"></i>Contraseña
        </label>
        <div class="input-group">
          <input
            type="password"
            id="registerPassword"
            class="form-control"
            placeholder="Mínimo 8 caracteres"
            autocomplete="new-password"
            minlength="8"
            required
          />
          <button
            type="button"
            id="togglePwd"
            class="btn btn-toggle-pwd"
            aria-label="Mostrar / ocultar contraseña"
            onclick="togglePassword('registerPassword', 'togglePwd')"
          >
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <small class="form-hint">Usa al menos 8 caracteres.</small>
      </div>

      <!-- Confirmar contraseña -->
      <div class="mb-3">
        <label for="registerPasswordConfirm" class="form-label">
          <i class="bi bi-shield-lock me-1 text-muted"></i>Confirmar contraseña
        </label>
        <div class="input-group">
          <input
            type="password"
            id="registerPasswordConfirm"
            class="form-control"
            placeholder="Repite tu contraseña"
            autocomplete="new-password"
            required
          />
          <button
            type="button"
            id="togglePwd2"
            class="btn btn-toggle-pwd"
            aria-label="Mostrar / ocultar contraseña"
            onclick="togglePassword('registerPasswordConfirm', 'togglePwd2')"
          >
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <small id="matchHint" class="form-hint"></small>
      </div>

      <!-- Submit -->
      <button type="submit" id="registerBtn" class="btn btn-primary-custom mt-1">
        <span id="registerSpinner" class="btn-spinner"></span>
        <i class="bi bi-person-check me-1"></i>Crear cuenta
      </button>

    </form>

    <!-- Divider -->
    <div class="divider">¿Ya tienes cuenta?</div>

    <p class="text-center mb-0" style="font-size:.9rem;">
      <a href="index.html" class="auth-link">
        <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar sesión
      </a>
    </p>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Toggle ojo (igual al de login)
    function togglePassword(inputId, btnId) {
      const input = document.getElementById(inputId);
      const icon  = document.querySelector(`#${btnId} i`);
      const isPwd = input.type === 'password';
      input.type = isPwd ? 'text' : 'password';
      icon.classList.toggle('bi-eye');
      icon.classList.toggle('bi-eye-slash');
    }

    // Validación viva de coincidencia de contraseñas
    const pwd     = document.getElementById('registerPassword');
    const pwd2    = document.getElementById('registerPasswordConfirm');
    const hint    = document.getElementById('matchHint');

    function checkMatch() {
      if (!pwd2.value) { hint.textContent = ''; hint.className = 'form-hint'; return; }
      if (pwd.value === pwd2.value) {
        hint.textContent = 'Las contraseñas coinciden.';
        hint.className = 'form-hint text-success';
      } else {
        hint.textContent = 'Las contraseñas no coinciden.';
        hint.className = 'form-hint text-danger';
      }
    }
    pwd.addEventListener('input', checkMatch);
    pwd2.addEventListener('input', checkMatch);

    // Handler de envío (mock — luego conectas con la API)
    function handleRegister(e) {
      e.preventDefault();
      const alertBox = document.getElementById('registerAlert');
      alertBox.style.display = 'none';

      if (pwd.value !== pwd2.value) {
        alertBox.className = 'alert alert-danger mb-3';
        alertBox.textContent = 'Las contraseñas no coinciden.';
        alertBox.style.display = 'block';
        return;
      }

      // TODO: POST /api/auth/register
      alertBox.className = 'alert alert-success mb-3';
      alertBox.textContent = 'Cuenta creada. Redirigiendo…';
      alertBox.style.display = 'block';
      setTimeout(() => window.location.href = 'index.html', 1200);
    }
  </script>
</body>
</html>
